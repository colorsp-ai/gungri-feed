name: 궁리 일자리 점검 (빠른 시험)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 일자리 수집 시험
        continue-on-error: true
        env:
          SENURI_KEY: ${{ secrets.SENURI_KEY }}
        run: |
          python -m collector.senuri --out /tmp/jobs
          head -c 1500 /tmp/jobs/gungri_jobs.json
      - name: 수행기관 응답 확인
        continue-on-error: true
        env:
          SENURI_KEY: ${{ secrets.SENURI_KEY }}
        run: python -m collector.orgs --probe
