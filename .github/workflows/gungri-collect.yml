name: 궁리 자동 수집 (TourAPI)

on:
  schedule:
    - cron: '10 20 * * *'   # 매일 05:10 (한국시간)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gungri-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 단위 시험
        run: python -m unittest collector.test_collector
      - name: 수집
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        run: python -m collector.run --out feed
      - name: 피드 저장(바뀐 경우만)
        run: |
          git config user.name  "gungri-collector"
          git config user.email "gungri-collector@users.noreply.github.com"
          git add feed/gungri_feed.json feed/state.json
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "feed: $(date -u +%F) 자동 수집" && git push; fi
