name: 궁리 자동 수집 (TourAPI)
on:
  schedule:
    - cron: '10 20 * * *'   # 매일 05:10 (한국시간)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: gungri-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # 다시 실행(Re-run)해도 항상 최신 main 기준으로 받음
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 단위 시험
        run: python -m unittest collector.test_collector
      - name: 수집
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        run: python -m collector.run --out feed
      - name: 시니어 일자리 응답 확인(직접 실행했을 때만)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SENURI_KEY: ${{ secrets.SENURI_KEY }}
        run: python -m collector.senuri --probe
      - name: 시니어 일자리 수집
        continue-on-error: true   # 이 단계가 실패해도 위의 장소·행사 수집 결과는 그대로 저장됨
        env:
          SENURI_KEY: ${{ secrets.SENURI_KEY }}
        run: python -m collector.senuri --out feed
      - name: 피드 저장(바뀐 경우만)
        run: |
          git config user.name  "gungri-collector"
          git config user.email "gungri-collector@users.noreply.github.com"
          git add feed/gungri_feed.json feed/state.json
          if [ -f feed/gungri_jobs.json ]; then git add feed/gungri_jobs.json; fi
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "feed: $(date -u +%F) 자동 수집"
          # 수집하는 동안 저장소가 바뀌었으면(직접 올린 파일 등) 최신을 받아 이 결과를 위에 얹고 다시 저장
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "저장 재시도 $i"; git rebase --abort 2>/dev/null; sleep 5
          done
          echo "저장 실패"; exit 1
